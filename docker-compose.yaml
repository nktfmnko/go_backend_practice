services:
  todoapp-postgres:
    image: postgres:18.6-bookworm
    container_name: todoapp-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - todoapp-pgdata:/var/lib/postgresql
    restart: always

  todoapp-redis:
    image: redis:8.8.3-trixie
    container_name: todoapp-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - todoapp-redisdata:/data
    restart: unless-stopped

  todoapp-postgres-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
    depends_on:
      - todoapp-postgres

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: todoapp-postgres-port-forwarder
    command:
      - TCP-LISTEN:5433,fork,reuseaddr
      - TCP:todoapp-postgres:5432
    ports:
      - "127.0.0.1:5433:5433"
    depends_on:
      - todoapp-postgres
    restart: unless-stopped

  redis-port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: todoapp-redis-port-forwarder
    command:
      - TCP-LISTEN:6380,fork,reuseaddr
      - TCP:todoapp-redis:6379
    ports:
      - "127.0.0.1:6380:6380"
    depends_on:
      - todoapp-redis
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:main
    container_name: todoapp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  todoapp-pgdata:
  todoapp-redisdata:
  prometheus_data: