syntax = "proto3";

package proto.v1;

option go_package = "practice/pkg/pb/v1;v1";

import "google/protobuf/empty.proto";
import "validate/validate.proto";

service UsersServiceV1{
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
  rpc PatchUser(PatchUserRequest) returns (PatchUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty);
}

message UserInfo{
  string full_name = 1  [(validate.rules).string = {min_len: 3, max_len:100}];
  optional string phone_number = 2 [(validate.rules).string = {min_len: 10, max_len:15, prefix: "+"}];
}

message User{
  int64 id = 1;
  int64 version = 2;
  UserInfo info = 3;
}

message UserPatch{
  optional string full_name = 1;
  optional string phone_number = 2;
}

message CreateUserRequest{
  UserInfo info = 1;
}

message CreateUserResponse{
  User user = 1;
}

message GetUserRequest{
  int64 id = 1;
}

message GetUserResponse{
  User user = 1;
}

message GetUsersRequest{
  optional int64 limit = 1;
  optional int64 offset = 2;
}

message GetUsersResponse{
  repeated User users = 1;
}

message PatchUserRequest{
  int64 id = 1;
  UserPatch patch = 2;
}

message PatchUserResponse{
  User user = 1;
}

message DeleteUserRequest{
  int64 id = 1;
}