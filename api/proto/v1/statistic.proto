syntax = "proto3";

package proto.v1;

option go_package = "practice/pkg/pb/v1;v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

service StatisticServiceV1 {
  rpc GetStatistics (GetStatisticsRequest) returns(GetStatisticsResponse);
}

message GetStatisticsRequest{
  optional int64 user_id = 1;
  optional google.protobuf.Timestamp from = 2;
  optional google.protobuf.Timestamp to = 3;
}

message GetStatisticsResponse{
  int64 tasks_created = 1;
  int64 tasks_completed = 2;
  optional float task_completed_rate = 3;
  optional google.protobuf.Duration tasks_average_completion_time = 4;
}
