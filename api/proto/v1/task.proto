syntax = "proto3";

package proto.v1;

option go_package = "practice/pkg/pb/v1;v1";

import "google/protobuf/wrappers.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service TasksServiceV1{
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc GetTasks(GetTasksRequest) returns (GetTasksResponse);
  rpc PatchTask(PatchTaskRequest) returns (PatchTaskResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (google.protobuf.Empty);
}

message TaskInfo{
  string title = 1;
  google.protobuf.StringValue description = 2;
  int64 author_user_id = 3;
}

message Task{
  int64 id = 1;
  int64 version = 2;
  bool completed = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp completed_at = 5;
  TaskInfo info = 6;
}

message TaskPatch{
  google.protobuf.StringValue title = 1;
  google.protobuf.StringValue description = 2;
  google.protobuf.BoolValue completed = 3;
}

message CreateTaskRequest{
  TaskInfo info = 1;
}

message CreateTaskResponse{
  Task task = 1;
}

message GetTaskRequest{
  int64 id = 1;
}

message GetTaskResponse{
  Task task = 1;
}

message GetTasksRequest{
  google.protobuf.Int64Value user_id = 1;
  google.protobuf.Int64Value limit = 2;
  google.protobuf.Int64Value offset = 3;
}

message GetTasksResponse{
  repeated Task tasks = 1;
}

message PatchTaskRequest{
  int64 id = 1;
  TaskPatch patch = 2;
}

message PatchTaskResponse{
  Task task = 1;
}

message DeleteTaskRequest{
  int64 id = 1;
}